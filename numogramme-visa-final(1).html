<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Ode Hissée — Numogramme V.I.S.A.</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0d1b2a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100vh;
  padding: 32px 16px 48px;
  font-family: 'Atkinson Hyperlegible', sans-serif;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.1rem, 2.5vw, 1.6rem);
  color: #F5F0E8;
  letter-spacing: 3px;
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 6px;
}
.subtitle {
  font-family: 'Kalam', cursive;
  font-size: clamp(0.75rem, 1.5vw, 0.95rem);
  color: #B87333;
  text-align: center;
  margin-bottom: 28px;
  letter-spacing: 1px;
}

.canvas-wrap {
  width: 100%;
  max-width: 860px;
  position: relative;
}

svg {
  width: 100%;
  height: auto;
  overflow: visible;
}

/* Animations */
@keyframes rotate-outer {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes dash-boucle {
  to { stroke-dashoffset: -40; }
}
@keyframes glow {
  0%, 100% { filter: drop-shadow(0 0 8px #B87333aa); }
  50% { filter: drop-shadow(0 0 20px #B87333ff); }
}
@keyframes bubble-in {
  from { opacity: 0; transform: scale(0.7); }
  to   { opacity: 1; transform: scale(1); }
}

.enfant-glow { animation: glow 3s ease-in-out infinite; }
.outer-ring {
  transform-origin: 430px 390px;
  animation: rotate-outer 80s linear infinite;
}
.boucle-arrow {
  stroke-dasharray: 8 5;
  animation: dash-boucle 1.8s linear infinite;
}

/* Nœuds cliquables */
.node-group {
  cursor: pointer;
  transition: filter 0.2s;
}
.node-group:hover .node-bg {
  filter: brightness(1.4);
}
.node-group.active .node-bg {
  filter: brightness(1.6) drop-shadow(0 0 10px #FFD98Aaa);
}

/* Bulle flottante */
#bubble {
  display: none;
  position: fixed;
  z-index: 999;
  pointer-events: none;
  animation: bubble-in 0.22s cubic-bezier(.34,1.56,.64,1) both;
}
#bubble.visible {
  display: block;
}
#bubble-inner {
  background: radial-gradient(ellipse at 30% 20%, #1a3555, #0d1f35);
  border: 1.5px solid #3A5F7D;
  border-radius: 50%;
  width: 220px;
  height: 220px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  text-align: center;
  box-shadow: 0 0 32px #B8733344, 0 4px 24px #00000088;
  position: relative;
}
#bubble-inner::before {
  content: '';
  position: absolute;
  inset: 6px;
  border-radius: 50%;
  border: 1px solid rgba(168, 200, 224, 0.12);
  pointer-events: none;
}
#bubble-num {
  font-family: 'Playfair Display', serif;
  font-size: 0.72rem;
  letter-spacing: 3px;
  color: #7ab0cc;
  text-transform: uppercase;
  margin-bottom: 4px;
}
#bubble-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: #F5F0E8;
  margin-bottom: 8px;
  line-height: 1.2;
}
#bubble-desc {
  font-family: 'Atkinson Hyperlegible', sans-serif;
  font-size: 0.68rem;
  color: #a8c0d8;
  line-height: 1.55;
}
#bubble-cause {
  font-family: 'Kalam', cursive;
  font-size: 0.62rem;
  color: #B87333;
  margin-top: 8px;
  line-height: 1.4;
  font-style: italic;
}
#bubble-close-hint {
  font-size: 0.55rem;
  color: #3A5F7D;
  margin-top: 10px;
  letter-spacing: 1px;
}

/* Couleurs par nœud */
#bubble-inner.col-bleu   { border-color: #5B8FA8; }
#bubble-inner.col-bleu #bubble-title { color: #A8C8E0; }
#bubble-inner.col-cuivre { border-color: #B87333; background: radial-gradient(ellipse at 30% 20%, #2a1800, #160d00); }
#bubble-inner.col-cuivre #bubble-title { color: #FFD98A; }
#bubble-inner.col-cuivre #bubble-num  { color: #e0a060; }
#bubble-inner.col-vert   { border-color: #5C7A5C; background: radial-gradient(ellipse at 30% 20%, #0f2810, #0a1a0a); }
#bubble-inner.col-vert   #bubble-title { color: #8aba8a; }
#bubble-inner.col-vert   #bubble-num   { color: #6a9a6a; }
#bubble-inner.col-or     { border-color: #D4AF37; background: radial-gradient(ellipse at 30% 20%, #2a1e00, #160f00); }
#bubble-inner.col-or     #bubble-title { color: #FFD98A; }

/* Hint flottant initial */
#hint {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(13,27,42,0.92);
  border: 1px solid #3A5F7D;
  border-radius: 24px;
  padding: 8px 20px;
  font-size: 0.72rem;
  color: #7ab0cc;
  letter-spacing: 1px;
  font-family: 'Atkinson Hyperlegible', sans-serif;
  pointer-events: none;
  transition: opacity 0.5s;
}
#hint.hidden { opacity: 0; }
</style>
</head>

<div id="bubble">
  <div id="bubble-inner">
    <div id="bubble-num"></div>
    <div id="bubble-title"></div>
    <div id="bubble-desc"></div>
    <div id="bubble-cause"></div>
    <div id="bubble-close-hint">· cliquer ailleurs pour fermer ·</div>
  </div>
</div>

<!-- HINT -->
<div id="hint">💡 Cliquer sur un nœud pour explorer</div>

<script>
const DATA = {
  c1: {
    num: "C1 — Centre",
    title: "L'Enfant",
    desc: "L'enfant est au cœur de tout. Chaque décision, chaque outil, chaque action rayonne depuis lui — pas depuis ses déficits, mais depuis son fonctionnement unique, ses besoins réels, ses forces.",
    cause: "Partir de l'enfant → tout s'aligne.",
    color: "col-or"
  },
  c2: {
    num: "C2 — Compréhension",
    title: "Lire le fonctionnement unique",
    desc: "Avant d'agir, comprendre. Lire le profil sensoriel, cognitif et émotionnel de l'enfant. Sortir du « comportement problème » pour entrer dans la logique de l'enfant. C'est la boussole.",
    cause: "Compréhension → moins d'errance, plus d'efficacité.",
    color: "col-bleu"
  },
  c3: {
    num: "C3 — Communication",
    title: "Donner une voix — CAA",
    desc: "Tout enfant a le droit de s'exprimer. La Communication Alternative et Augmentée (CAA) — ARASAAC, PECS, PODD — n'est pas un outil de substitution : c'est une langue. Généraliser partout, par tous.",
    cause: "CAA généralisée → réduction des crises, autonomie accrue.",
    color: "col-bleu"
  },
  c4: {
    num: "C4 — Coordination",
    title: "Trianguler les acteurs",
    desc: "Famille, professionnels, école/cité : les trois pôles doivent parler le même langage. La Blouse Bleue orchestre cette triangulation — cahier de liaison, réunions, formations flash 15 min.",
    cause: "Coordination → cohérence vécue par l'enfant.",
    color: "col-bleu"
  },
  c5: {
    num: "C5 — Compétences",
    title: "Outiller l'entourage",
    desc: "Former les auxiliaires, les AESH, les parents, les animateurs. Ateliers pratiques (cuisine, jardinage, bricolage avec Popillos). Répétition structurée TEACCH. Les 167 h hors séances comptent autant que les 30 min de soin.",
    cause: "Entourage outillé → autonomie progressive au quotidien.",
    color: "col-bleu"
  },
  c6: {
    num: "C6 — Cohérence",
    title: "Aligner les approches",
    desc: "Un enfant qui reçoit des messages contradictoires régresse. Aligner les approches entre tous les acteurs — même vocabulaire, mêmes routines, mêmes réponses aux comportements — est non négociable.",
    cause: "Cohérence → sécurité interne, apprentissages stabilisés.",
    color: "col-bleu"
  },
  c7: {
    num: "C7 — Comportement · PIVOT",
    title: "Décoder le message",
    desc: "Le comportement dit quelque chose. Cri, repli, agitation : c'est une communication non verbale. Le décoder, c'est trouver le besoin sous-jacent — sensoriel, émotionnel, communicationnel — avant de répondre.",
    cause: "Décodage → moins d'escalade, plus de lien.",
    color: "col-cuivre"
  },
  c8: {
    num: "C8 — Contexte",
    title: "Adapter l'environnement",
    desc: "L'environnement parle avant même que l'adulte ouvre la bouche. Lumières, bruits, espaces, emploi du temps visuel, zones de décompression : adapter le contexte, c'est prévenir plutôt que guérir.",
    cause: "Environnement adapté → moins de surcharge, plus de participation.",
    color: "col-vert"
  },
  c9: {
    num: "C9 — Communautaire",
    title: "Inclure la cité",
    desc: "L'inclusion ne s'arrête pas à la porte de l'école. Cantine, transports, médiathèque, piscine, fête de quartier : chaque acteur de la cité peut être formé, sensibilisé, allié. Tache d'huile.",
    cause: "Cité inclusive → enfant citoyen, famille respirant.",
    color: "col-vert"
  },
  c10: {
    num: "C10 — Citoyenneté",
    title: "L'adulte de demain",
    desc: "L'horizon de tout le parcours : un adulte autiste qui vit, choisit, contribue. Pas une case dans un ESAT. Un citoyen. Ce que V.I.S.A. prépare dès la première année de vie, c'est cette dignité-là.",
    cause: "Citoyenneté préparée dès l'enfance → adulte autonome et inclus.",
    color: "col-vert"
  },
  famille: {
    num: "Pôle · Triangulation",
    title: "La Famille",
    desc: "Premier pilier du triangle de soutien. Sécurité affective, valeurs, continuité éducative à domicile. La famille est experte de son enfant — V.I.S.A. l'arme et la reconnaît comme telle.",
    cause: "Famille armée → relais naturel de tous les apprentissages.",
    color: "col-bleu"
  },
  ecole: {
    num: "Pôle · Triangulation",
    title: "École & Cité",
    desc: "Deuxième pilier : le monde social et scolaire. AESH, instits, agents de cantine, animateurs périscolaires. L'école inclusive ne se décrète pas — elle se construit, acteur par acteur, formation flash par formation flash.",
    cause: "École formée → inclusion réelle, pas de façade.",
    color: "col-vert"
  },
  pros: {
    num: "Pôle · Triangulation",
    title: "Les Professionnels",
    desc: "Troisième pilier : les intervenants du soin, du social, du juridique, de l'éducatif. Auxiliaires de vie, orthophonistes, psychomotriciens, MDPH... La triangulation les relie à la famille et à l'école.",
    cause: "Professionnels coordonnés → pas de perte en translation.",
    color: "col-cuivre"
  },
  bb: {
    num: "Rôle · Blouse Bleue",
    title: "Nathalie — Parent Ressource",
    desc: "La Blouse Bleue est au centre du dispositif, entre les trois pôles. Elle ne remplace personne — elle articule, traduit, forme, orchestre. Formation flash 15 min, outils CAA sur mesure, médiation culturelle.",
    cause: "Blouse Bleue → le ciment invisible qui tient le système.",
    color: "col-bleu"
  }
};

const bubble = document.getElementById('bubble');
const bubbleInner = document.getElementById('bubble-inner');
const bubbleNum = document.getElementById('bubble-num');
const bubbleTitle = document.getElementById('bubble-title');
const bubbleDesc = document.getElementById('bubble-desc');
const bubbleCause = document.getElementById('bubble-cause');
const hint = document.getElementById('hint');

let activeNode = null;
let hintHidden = false;

function showBubble(nodeKey, clickX, clickY) {
  const d = DATA[nodeKey];
  if (!d) return;

  bubbleNum.textContent = d.num;
  bubbleTitle.textContent = d.title;
  bubbleDesc.textContent = d.desc;
  bubbleCause.textContent = d.cause ? '→ ' + d.cause : '';

  // Reset colors
  bubbleInner.className = d.color || 'col-bleu';

  // Position
  const bw = 220, bh = 220;
  const margin = 12;
  const vw = window.innerWidth, vh = window.innerHeight;

  let x = clickX + 16;
  let y = clickY - bh / 2;

  if (x + bw > vw - margin) x = clickX - bw - 16;
  if (y < margin) y = margin;
  if (y + bh > vh - margin) y = vh - bh - margin;

  bubble.style.left = x + 'px';
  bubble.style.top = y + 'px';

  bubble.classList.remove('visible');
  void bubble.offsetWidth; // force reflow for animation
  bubble.classList.add('visible');

  if (!hintHidden) {
    hint.classList.add('hidden');
    hintHidden = true;
  }
}

function hideBubble() {
  bubble.classList.remove('visible');
  if (activeNode) {
    activeNode.classList.remove('active');
    activeNode = null;
  }
}

// Attacher les événements à tous les nœuds
document.querySelectorAll('.node-group[data-node]').forEach(g => {
  g.addEventListener('click', function(e) {
    e.stopPropagation();
    const key = this.dataset.node;

    if (activeNode === this) {
      hideBubble();
      return;
    }
    if (activeNode) activeNode.classList.remove('active');
    activeNode = this;
    this.classList.add('active');

    showBubble(key, e.clientX, e.clientY);
  });
});

// Fermer en cliquant ailleurs
document.addEventListener('click', function(e) {
  if (!e.target.closest('.node-group')) hideBubble();
});

// Masquer le hint après 4s
setTimeout(() => {
  if (!hintHidden) hint.classList.add('hidden');
}, 4000);
</script>
